allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
# Security patches for transitive dependencies. Dependabot cannot raise these itself on a
# pnpm project, so each entry pins the lowest patched release for an open advisory. The
# selectors are scoped per major so packages that legitimately sit on an older major are
# not dragged across a breaking boundary. Drop an entry once every dependent has moved
# past it on its own.
overrides:
  brace-expansion@2: '>=2.1.4' # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895
  brace-expansion@5: '>=5.0.9' # GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895
  js-yaml@4: '>=4.3.1' # GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj
  nanoid@3: '>=3.3.18' # GHSA-2v37-7h3g-55p8
  postcss@8: '>=8.5.23' # GHSA-r28c-9q8g-f849, GHSA-fxqj-rqcc-2cmp
  socket.io-parser@4: '>=4.2.7' # GHSA-2m8v-j782-fhvr
  svgo@4: '>=4.0.2' # GHSA-2p49-hgcm-8545
  tar@7: '>=7.5.21' # GHSA-r292-9mhp-454m
  ws@8: '>=8.21.0' # GHSA-96hv-2xvq-fx4p
