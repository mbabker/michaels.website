allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
# Added by pnpm when Nuxt 4.6 was installed the day after release. Each entry is pinned to one
# exact version, so it lets nothing else through; drop the block once these age past the window.
minimumReleaseAgeExclude:
  - '@nuxt/cli@4.0.0'
  - '@nuxt/kit@4.6.0'
  - '@nuxt/nitro-server@4.6.0'
  - '@nuxt/schema@4.6.0'
  - '@nuxt/vite-builder@4.6.0'
  - '@nuxt/vite-server@4.6.0'
  - nuxt@4.6.0
# Security patches for transitive dependencies. Dependabot cannot raise these itself on a
# pnpm project, so each entry pins the lowest patched release for an open advisory. The
# selectors are scoped per major so packages that legitimately sit on an older major are
# not dragged across a breaking boundary. Drop an entry once every dependent has moved
# past it on its own.
overrides:
  # fontless asks for ^0.27.0 and the fix only exists in 0.28.1, so this one does cross a
  # breaking boundary. The rest of the tree is already on 0.28, so the override dedupes to
  # the version vite and rolldown are building against rather than introducing a new one.
  esbuild@0.27: '>=0.28.1' # GHSA-g7r4-m6w7-qqqr
  ws@8: '>=8.21.0' # GHSA-96hv-2xvq-fx4p
