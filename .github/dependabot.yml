version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - javascript
    versioning-strategy: increase
    ignore:
      # We build and deploy with Node 24, so a major bump of the types package shouldn't be proposed.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # 2.4.1 and 2.5.0 leave `_api.setFetch` undefined during SSR, so icons are missing
      # from the prerendered markup until hydration. See nuxt/icon#518.
      - dependency-name: "@nuxt/icon"
        versions:
          - ">=2.4.1"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      major:
        applies-to: version-updates
        update-types:
          - major
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - CI
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
