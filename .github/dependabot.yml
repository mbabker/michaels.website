version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - javascript
    versioning-strategy: increase
    ignore:
      # We build and deploy with Node 24, so a major bump of the types package shouldn't be proposed.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # 2.4.1 and 2.5.0 fail to load every locally-installed Iconify collection during
      # prerender, which ships the site without icons. Drop this once upstream is fixed.
      - dependency-name: "@nuxt/icon"
        versions:
          - ">=2.4.1"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      major:
        applies-to: version-updates
        update-types:
          - major
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - CI
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
